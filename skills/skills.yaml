# SkillTrend AI — skill dictionary
#
# Structure:  Category -> Canonical Name -> [aliases]
# The canonical name is ALWAYS matched in addition to its aliases.
# Matching is case-insensitive and token-based (see scripts/skill_extractor.py).
#
# Built from evidence: every entry was checked against the actual corpus.
# Terms appearing in fewer than ~30 postings were left out as unusable.

