# ---------------------------------------------------------------------
# Skills whose CANONICAL NAME must not be matched on its own -- only
# their aliases count. Without this, "go above and beyond" matches Go.
# ---------------------------------------------------------------------
canonical_not_matched:
  - Go


# ---------------------------------------------------------------------
# Ambiguity rules: reject a match when the NEXT token is in this list.
# These exist because some skill names are also ordinary English words.
# ---------------------------------------------------------------------
blocked_next_tokens:
  Microsoft Excel: [at, in, as, beyond]        # "excel at communication"
  Apache Spark: [innovation, creativity, interest, joy, change, ideas, conversations]
  R: ["&"]                                     # "R & D"
  Domo: [arigato]